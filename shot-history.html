<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ritual — history</title>
<link rel="stylesheet" href="ritual-shared.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.search-wrap {
  position: sticky;
  top: 64px;
  z-index: 50;
  background: var(--surface);
  padding: 10px 0 8px;
  margin: 0 0 4px;
}

.search-input-wrap {
  position: relative;
}

.search-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--on-surface-mid);
  opacity: 0.5;
  pointer-events: none;
}

.search-input {
  padding-left: 40px !important;
}

.shot-card {
  background: var(--surface-low);
  border-radius: var(--radius-card);
  border: 1px solid rgba(255,255,255,0.05);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: relative;
  overflow: hidden;
  transition: transform 0.25s ease, opacity 0.25s ease;
}

.shot-card.deleting {
  transform: translateX(-100%);
  opacity: 0;
}

.shot-card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.shot-card-title {
  font-size: 1rem;
  font-weight: 700;
  color: var(--on-surface);
  line-height: 1.2;
}

.shot-card-sub {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--on-surface-mid);
  margin-top: 3px;
}

.shot-stats-row {
  display: flex;
  gap: 0;
  background: var(--surface-mid);
  border-radius: 10px;
  overflow: hidden;
}

.stat-cell {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 6px;
  gap: 3px;
  border-right: 1px solid rgba(255,255,255,0.04);
}
.stat-cell:last-child { border-right: none; }

.stat-val {
  font-size: 1.1rem;
  font-weight: 800;
  color: var(--on-surface);
  letter-spacing: -0.03em;
  line-height: 1;
}

.stat-key {
  font-size: 7.5px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--on-surface-mid);
}

.shot-tags-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.shot-tag-pill {
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.shot-tag-pill.t-brewer { background: var(--surface-high); color: var(--on-surface-mid); }
.shot-tag-pill.t-grind { background: var(--surface-mid); color: var(--primary); }
.shot-tag-pill.t-rating { }

.shot-notes {
  font-size: 0.8rem;
  color: var(--on-surface-mid);
  font-weight: 500;
  line-height: 1.45;
  font-style: italic;
  border-left: 2px solid var(--outline);
  padding-left: 10px;
}

.delete-btn {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: transparent;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--on-surface-low);
  transition: color 0.15s, background 0.15s;
  flex-shrink: 0;
}
.delete-btn:hover { color: var(--error); background: rgba(255,180,171,0.08); }

/* Filter chips */
.filter-row {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.filter-row::-webkit-scrollbar { display: none; }

.filter-chip {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  background: var(--surface-high);
  color: var(--on-surface-mid);
  border: none;
  cursor: pointer;
  font-family: var(--font);
  transition: all 0.15s;
}
.filter-chip.active { background: var(--primary); color: var(--on-primary); }

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--on-surface-mid);
}
.empty-state-icon {
  font-size: 2rem;
  margin-bottom: 12px;
  opacity: 0.3;
}
.empty-state p {
  font-size: 0.85rem;
  font-weight: 500;
  opacity: 0.6;
}

/* Rating badge colours */
.rating-balanced { background: rgba(180,200,160,0.08); color: #8aaa74; border: 1px solid rgba(138,170,116,0.15); }
.rating-under    { background: rgba(200,170,90,0.08);  color: #a8904e; border: 1px solid rgba(200,170,90,0.15);  }
.rating-over     { background: rgba(200,100,90,0.08);  color: #a86058; border: 1px solid rgba(200,100,90,0.15);  }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="index.html" class="header-icon" aria-label="Back">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <path d="M11 4L6 9L11 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <span class="wordmark">history</span>
    <div class="header-icon" style="opacity:0;pointer-events:none;"></div>
  </div>
</header>

<main class="page" style="gap:10px;">

  <div class="search-wrap">
    <div class="search-input-wrap" style="margin-bottom:10px;">
      <span class="search-icon">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
          <circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.4"/>
          <path d="M10.5 10.5L13.5 13.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </span>
      <input type="text" class="search-input" id="search" placeholder="search shots…">
    </div>
    <div class="filter-row" id="filter-row">
      <button class="filter-chip active" data-filter="all">all</button>
      <button class="filter-chip" data-filter="balanced">balanced</button>
      <button class="filter-chip" data-filter="under">under-extracted</button>
      <button class="filter-chip" data-filter="over">over-extracted</button>
    </div>
  </div>

  <div id="shots-container" style="display:flex; flex-direction:column; gap:10px;"></div>

</main>

<nav class="bottom-nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-tab">tracker</a>
    <button class="nav-tab active">history</button>
    <button class="nav-tab">inventory</button>
    <button class="nav-tab">brew</button>
  </div>
</nav>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://pblsuaypnzvbdjbnqghv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBibHN1YXlwbnp2YmRqYm5xZ2h2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2MDg4NTIsImV4cCI6MjA5MDE4NDg1Mn0.qrHP35jRU5uMmGiHgfxqRjmo7Mg_5aA430Te2rDDGbM';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let shots = [], activeFilter = 'all', searchQuery = '';

function formatDate(d) {
  const now = new Date(), diff = now - d;
  if (diff < 60000) return 'just now';
  if (diff < 3600000) return Math.floor(diff/60000) + 'm ago';
  if (diff < 86400000) return Math.floor(diff/3600000) + 'h ago';
  const opts = {weekday:'short', day:'numeric', month:'short'};
  return d.toLocaleDateString('en-AU', opts);
}

function ratingClass(s) {
  if (s === 'Balanced') return 'rating-balanced';
  if (s === 'Under-extracted') return 'rating-under';
  return 'rating-over';
}
function ratingLabel(s) {
  if (s === 'Balanced') return 'balanced';
  if (s === 'Under-extracted') return 'under-extracted';
  if (s === 'Over-extracted') return 'over-extracted';
  return s ? s.toLowerCase() : 'unrated';
}

async function loadShots() {
  const { data, error } = await db.from('shots').select('*').order('created_at', { ascending: false });
  if (error) { console.error(error); return; }
  shots = data || [];
  renderShots();
}

function getFilteredShots() {
  return shots.filter(s => {
    const matchFilter = activeFilter === 'all' || s.summary_label === activeFilter;
    const q = searchQuery.toLowerCase();
    const matchSearch = !q ||
      (s.bean_name || '').toLowerCase().includes(q) ||
      (s.brewer || '').toLowerCase().includes(q) ||
      (s.notes || '').toLowerCase().includes(q) ||
      (s.rating || '').toLowerCase().includes(q) ||
      (s.grind_speed || '').toLowerCase().includes(q);
    return matchFilter && matchSearch;
  });
}

function renderShots() {
  const container = document.getElementById('shots-container');
  const filtered = getFilteredShots();
  if (!filtered.length) {
    container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">☕</div><p>no shots found</p></div>`;
    return;
  }
  container.innerHTML = filtered.map(s => {
    const label = s.summary_label || 'Unrated';
    const rc = ratingClass(label);
    return `<div class="shot-card" data-id="${s.id}">
      <div class="shot-card-header">
        <div>
          <div class="shot-card-title">${s.bean_name || '—'}</div>
          <div class="shot-card-sub">${s.brewer ? s.brewer + ' · ' : ''}${formatDate(new Date(s.created_at))}</div>
        </div>
        <div style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
          <span class="shot-rating-badge ${rc}">${ratingLabel(label)}</span>
          <button class="delete-btn" onclick="deleteShot('${s.id}')" aria-label="Delete shot">
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
              <path d="M2 3.5h9M5 3.5V2.5h3v1M5.5 5.5v4M7.5 5.5v4M3 3.5l.5 7h6l.5-7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="shot-stats-row">
        <div class="stat-cell">
          <div class="stat-val">${s.grind_setting ?? '—'}</div>
          <div class="stat-key">grind</div>
        </div>
        <div class="stat-cell">
          <div class="stat-val">${s.duration ? s.duration + 's' : '—'}</div>
          <div class="stat-key">time</div>
        </div>
        <div class="stat-cell">
          <div class="stat-val">${s.dose_in || '—'}g → ${s.yield_out || '—'}g</div>
          <div class="stat-key">dose → yield</div>
        </div>
      </div>
      ${s.notes ? `<div class="shot-notes">${s.notes}</div>` : ''}
    </div>`;
  }).join('');
}

async function deleteShot(id) {
  const card = document.querySelector(`.shot-card[data-id="${id}"]`);
  if (card) card.classList.add('deleting');
  setTimeout(async () => {
    const { error } = await db.from('shots').delete().eq('id', id);
    if (error) { console.error(error); showToast('could not delete'); return; }
    shots = shots.filter(s => s.id !== id);
    renderShots();
    showToast('shot deleted');
  }, 260);
}

// Search
document.getElementById('search').addEventListener('input', e => { searchQuery = e.target.value; renderShots(); });

// Filter chips
document.getElementById('filter-row').querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    activeFilter = chip.dataset.filter;
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    renderShots();
  });
});

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

loadShots();
</script>
</body>
</html>

<style id="__om-edit-overrides">
</style>
