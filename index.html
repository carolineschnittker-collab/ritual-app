<style>
/* ─── Combined Ring ──────────────────────────────────── */
.combo-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.combo-wrap {
  position: relative;
  width: 260px;
  height: 260px;
  cursor: grab;
  user-select: none;
  touch-action: none;
}
.combo-wrap:active { cursor: grabbing; }

.combo-inner {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  pointer-events: none;
}

.combo-timer-time {
  font-size: 1.4rem;
  font-weight: 800;
  letter-spacing: -0.04em;
  color: var(--on-surface);
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.combo-hint {
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  min-height: 14px;
}

.combo-grind-val {
  font-size: 1.1rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--primary);
  line-height: 1;
  margin-top: 6px;
}

.combo-grind-label {
  font-size: 7px;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--on-surface-mid);
}

/* ─── Timer controls ─────────────────────────────────── */

.timer-controls {
  display: flex;
  gap: 10px;
  width: 100%;
}

.btn-timer {
  flex: 1;
  padding: 13px;
  border-radius: 12px;
  font-family: var(--font);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  cursor: pointer;
  border: none;
  transition: all 0.15s;
}

.btn-timer-reset {
  background: var(--surface-high);
  color: var(--on-surface-mid);
}
.btn-timer-reset:hover { background: var(--surface-highest); }

.btn-timer-start {
  flex: 2;
  background: var(--primary);
  color: var(--on-primary);
}
.btn-timer-start:hover { opacity: 0.9; }
.btn-timer-start.running {
  background: var(--surface-high);
  color: var(--primary);
  border: 1px solid rgba(241,223,211,0.15);
}

/* ─── Currently Brewing ──────────────────────────────── */
.brewing-card {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brewing-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--secondary);
  flex-shrink: 0;
  box-shadow: 0 0 8px var(--secondary);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.brewing-info {
  flex: 1;
  min-width: 0;
}

.brewing-name {
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--on-surface);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.brewing-meta {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--on-surface-mid);
  margin-top: 2px;
}

.brewing-edit {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--surface-high);
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: var(--on-surface-mid);
  flex-shrink: 0;
  transition: background 0.15s;
  text-decoration: none;
}
.brewing-edit:hover { background: var(--surface-highest); }

/* ─── Shot Log Form ──────────────────────────────────── */
.form-section {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* ─── Recent History ─────────────────────────────────── */
.shot-row {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 14px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  position: relative;
}
.shot-row:last-child { border-bottom: none; padding-bottom: 0; }
.shot-row:first-child { padding-top: 0; }

.shot-row-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
}

.shot-bean-name {
  font-size: 0.875rem;
  font-weight: 700;
  color: var(--on-surface);
  line-height: 1.2;
}

.shot-meta-line {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
}

.shot-stat {
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--on-surface-mid);
}

.shot-stat-sep {
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: var(--on-surface-low);
}

.rating-balanced { background: rgba(180,200,160,0.08); color: #8aaa74; border: 1px solid rgba(138,170,116,0.15); }
.rating-under    { background: rgba(200,170,90,0.08);  color: #a8904e; border: 1px solid rgba(200,170,90,0.15);  }
.rating-over     { background: rgba(200,100,90,0.08);  color: #a86058; border: 1px solid rgba(200,100,90,0.15);  }

.shot-date {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--on-surface-low);
  white-space: nowrap;
}

/* ─── Grind confirm modal (centred) ──────────────────── */
.modal-overlay.centred {
  align-items: center;
  padding: 24px;
}
.modal-overlay.centred .modal-sheet {
  border-radius: 1.5rem;
  max-width: 320px;
  width: 100%;
  padding: 28px 24px;
}
</style>
</head>

<script>
// ─── Supabase ───────────────────────────────────────────
const SUPABASE_URL = 'https://pblsuaypnzvbdjbnqghv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBibHN1YXlwbnp2YmRqYm5xZ2h2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2MDg4NTIsImV4cCI6MjA5MDE4NDg1Mn0.qrHP35jRU5uMmGiHgfxqRjmo7Mg_5aA430Te2rDDGbM';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ─── Load current bean ──────────────────────────────────
async function loadBrewingBean() {
  const { data, error } = await db.from('current_bean').select('*').eq('id', 1).single();
  if (error || !data) return;
  document.getElementById('brewing-name').textContent = data.name || '—';
  const { count } = await db.from('shots').select('*', { count: 'exact', head: true });
  const shotsLeft = data.bag_weight ? Math.max(0, Math.floor(data.bag_weight / 20) - (count || 0)) : null;
  const parts = [data.roaster, shotsLeft !== null ? shotsLeft + ' shots left' : null].filter(Boolean);
  document.getElementById('brewing-meta').textContent = parts.join(' · ') || '';
}

// ─── Recent Shots ───────────────────────────────────────
function formatDate(d) {
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return 'just now';
  if (diff < 3600000) return Math.floor(diff/60000) + 'm ago';
  if (diff < 86400000) return Math.floor(diff/3600000) + 'h ago';
  return d.toLocaleDateString('en-AU', {day:'numeric', month:'short'});
}

function ratingClass(s) {
  if (s === 'Balanced') return 'rating-balanced';
  if (s === 'Under-extracted') return 'rating-under';
  return 'rating-over';
}
function ratingLabel(s) {
  if (s === 'Balanced') return 'balanced';
  if (s === 'Under-extracted') return 'under-extracted';
  if (s === 'Over-extracted') return 'over-extracted';
  return s || '—';
}

async function renderShots() {
  const container = document.getElementById('recent-shots');
  const { data: shots, error } = await db.from('shots').select('*').order('created_at', { ascending: false }).limit(4);
  if (error || !shots || !shots.length) {
    container.innerHTML = '<p style="font-size:0.8rem; color:var(--on-surface-mid); text-align:center; padding:20px 0;">no shots logged yet</p>';
    return;
  }
  container.innerHTML = shots.map(s => {
    const label = s.summary_label || 'Unrated';
    const doseLine = [s.dose_in ? s.dose_in + 'g → ' + (s.yield_out || '?') + 'g' : null, s.duration ? s.duration + 's' : null].filter(Boolean).join(' · ');
    return `<div class="shot-row">
      <div class="shot-row-top">
        <div>
          <div class="shot-bean-name">${s.bean_name || '—'}</div>
          <div class="shot-meta-line">
            <span class="shot-stat">grind ${s.grind_setting ?? '—'}</span>
            ${doseLine ? `<span class="shot-stat-sep"></span><span class="shot-stat">${doseLine}</span>` : ''}
            ${s.brewer ? `<span class="shot-stat-sep"></span><span class="shot-stat">${s.brewer}</span>` : ''}
          </div>
        </div>
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex-shrink:0;">
          <span class="shot-date">${formatDate(new Date(s.created_at))}</span>
          <span class="shot-rating-badge ${ratingClass(label)}">${ratingLabel(label)}</span>
        </div>
      </div>
      ${s.notes ? `<div style="font-size:0.75rem; color:var(--on-surface-mid); font-weight:500; line-height:1.4; opacity:0.8;">${s.notes}</div>` : ''}
    </div>`;
  }).join('');
}
renderShots();

// ─── Combined Grind + Timer ──────────────────────────────
const MIN_GRIND = 1, MAX_GRIND = 40;
const CIRC_INNER = 2 * Math.PI * 72; // ~452.4

const GRIND_STEPS = [
  { label: 'fine',          range: [1,  8]  },
  { label: 'medium-fine',   range: [9,  16] },
  { label: 'medium',        range: [17, 24] },
  { label: 'medium-coarse', range: [25, 32] },
  { label: 'coarse',        range: [33, 40] },
];
function grindStepName(g) {
  for (const s of GRIND_STEPS) if (g >= s.range[0] && g <= s.range[1]) return s.label;
  return 'medium';
}

// State
let grindVal = parseFloat(localStorage.getItem('ritual_grind') || '22');
let dialAngle = ((grindVal - MIN_GRIND) / (MAX_GRIND - MIN_GRIND)) * 360;
let isDragging = false;
let lastMouseAngle = 0;
let grindConfirmTimer = null;

// Elements
const comboWrap     = document.getElementById('combo-wrap');
const comboNotch    = document.getElementById('combo-notch');
const comboTicks    = document.getElementById('combo-ticks');
const comboProgress = document.getElementById('combo-progress');
const comboTimerEl  = document.getElementById('combo-timer-display');
const comboHintEl   = document.getElementById('combo-hint');
const comboGrindVal = document.getElementById('combo-grind-val');
const timerStartBtn = document.getElementById('timer-start');
const timerResetBtn = document.getElementById('timer-reset');

// Draw ticks on outer ring
(function drawTicks() {
  const TOTAL = 80;
  for (let i = 0; i < TOTAL; i++) {
    const angle = (i / TOTAL) * 360 - 90;
    const rad   = angle * Math.PI / 180;
    const isMajor = i % 16 === 0;
    const isMid   = i % 8 === 0 && !isMajor;
    const outerR  = 121, innerR = isMajor ? 106 : isMid ? 110 : 113;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', 130 + innerR * Math.cos(rad));
    line.setAttribute('y1', 130 + innerR * Math.sin(rad));
    line.setAttribute('x2', 130 + outerR * Math.cos(rad));
    line.setAttribute('y2', 130 + outerR * Math.sin(rad));
    line.setAttribute('stroke', isMajor ? 'rgba(241,223,211,0.55)' : isMid ? 'rgba(241,223,211,0.25)' : 'rgba(241,223,211,0.1)');
    line.setAttribute('stroke-width', isMajor ? '2' : '1');
    line.setAttribute('stroke-linecap', 'round');
    comboTicks.appendChild(line);
  }
})();

function updateNotch(angle) {
  const rad = (angle - 90) * Math.PI / 180;
  comboNotch.setAttribute('cx', 130 + 112 * Math.cos(rad));
  comboNotch.setAttribute('cy', 130 + 112 * Math.sin(rad));
}

function setGrind(v, updateAngle = true) {
  grindVal = Math.max(MIN_GRIND, Math.min(MAX_GRIND, Math.round(v * 10) / 10));
  if (updateAngle) dialAngle = ((grindVal - MIN_GRIND) / (MAX_GRIND - MIN_GRIND)) * 360;
  comboGrindVal.textContent = grindVal % 1 === 0 ? grindVal : grindVal.toFixed(1);
  updateNotch(dialAngle);
}
setGrind(grindVal);

function getPointerAngle(e, rect) {
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const px = e.touches ? e.touches[0].clientX : e.clientX;
  const py = e.touches ? e.touches[0].clientY : e.clientY;
  return Math.atan2(py - cy, px - cx) * 180 / Math.PI;
}

comboWrap.addEventListener('mousedown', e => {
  isDragging = true;
  lastMouseAngle = getPointerAngle(e, comboWrap.getBoundingClientRect());
});
comboWrap.addEventListener('touchstart', e => {
  isDragging = true;
  lastMouseAngle = getPointerAngle(e, comboWrap.getBoundingClientRect());
}, { passive: true });

document.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const a = getPointerAngle(e, comboWrap.getBoundingClientRect());
  let delta = a - lastMouseAngle;
  if (delta > 180) delta -= 360;
  if (delta < -180) delta += 360;
  lastMouseAngle = a;
  dialAngle = (dialAngle + delta + 360) % 360;
  const raw = MIN_GRIND + (dialAngle / 360) * (MAX_GRIND - MIN_GRIND);
  const newG = Math.round(raw * 10) / 10;
  if (newG !== grindVal) {
    grindVal = newG;
    comboGrindVal.textContent = grindVal % 1 === 0 ? grindVal : grindVal.toFixed(1);
    updateNotch(dialAngle);
    clearTimeout(grindConfirmTimer);
    grindConfirmTimer = setTimeout(() => showGrindConfirm(grindVal), 1500);
  }
});
document.addEventListener('touchmove', e => {
  if (!isDragging) return;
  const a = getPointerAngle(e, comboWrap.getBoundingClientRect());
  let delta = a - lastMouseAngle;
  if (delta > 180) delta -= 360;
  if (delta < -180) delta += 360;
  lastMouseAngle = a;
  dialAngle = (dialAngle + delta + 360) % 360;
  const raw = MIN_GRIND + (dialAngle / 360) * (MAX_GRIND - MIN_GRIND);
  const newG = Math.round(raw * 10) / 10;
  if (newG !== grindVal) {
    grindVal = newG;
    comboGrindVal.textContent = grindVal % 1 === 0 ? grindVal : grindVal.toFixed(1);
    updateNotch(dialAngle);
  }
}, { passive: true });
document.addEventListener('mouseup',  () => { isDragging = false; });
document.addEventListener('touchend', () => { isDragging = false; });


function showGrindConfirm(v) {
  document.getElementById('grind-modal-val').textContent = v;
  document.getElementById('grind-modal').classList.add('open');
}
document.getElementById('grind-cancel').addEventListener('click', () => {
  document.getElementById('grind-modal').classList.remove('open');
});
document.getElementById('grind-confirm').addEventListener('click', () => {
  localStorage.setItem('ritual_grind', grindVal);
  document.getElementById('grind-modal').classList.remove('open');
  showToast(grindStepName(grindVal) + ' · ' + grindVal + ' saved');
});

// ─── Timer ──────────────────────────────────────────────
let timerStart = null;
let timerElapsed = 0;
let timerRAF = null;
let timerRunning = false;
const maxSecs = 60;

function updateTimerDisplay(ms) {
  const total = ms / 1000;
  const secs  = Math.floor(total);
  const tenth = Math.floor((ms % 1000) / 100);
  comboTimerEl.textContent = `${secs}.${tenth}`;

  // Inner progress ring
  const frac   = Math.min(total / maxSecs, 1);
  const offset = CIRC_INNER - frac * CIRC_INNER;
  comboProgress.setAttribute('stroke-dashoffset', offset);

  // Colour + hint
  if (total >= 25 && total <= 35) {
    comboProgress.setAttribute('stroke', '#C8864A');
    comboHintEl.style.color = '#F0BD8B';
    comboHintEl.textContent = '✓ ideal';
  } else if (total > 35) {
    comboProgress.setAttribute('stroke', '#ff7a6a');
    comboHintEl.style.color = '#ff7a6a';
    comboHintEl.textContent = 'over';
  } else {
    comboProgress.setAttribute('stroke', '#F1DFD3');
    comboHintEl.style.color = 'transparent';
    comboHintEl.textContent = '';
  }

  // Autofill shot time on stop
  if (!timerRunning && total > 0) {
    const el = document.getElementById('f-time');
    if (!el.dataset.manuallySet) el.value = Math.round(total);
  }
}

function timerTick() {
  timerElapsed = Date.now() - timerStart;
  updateTimerDisplay(timerElapsed);
  timerRAF = requestAnimationFrame(timerTick);
}

timerStartBtn.addEventListener('click', () => {
  if (timerRunning) {
    timerRunning = false;
    timerElapsed = Date.now() - timerStart;
    cancelAnimationFrame(timerRAF);
    timerStartBtn.textContent = 'start';
    timerStartBtn.classList.remove('running');
    document.getElementById('f-time').value = Math.round(timerElapsed / 1000);
  } else {
    timerRunning = true;
    timerStart = Date.now() - timerElapsed;
    timerStartBtn.textContent = 'stop';
    timerStartBtn.classList.add('running');
    timerRAF = requestAnimationFrame(timerTick);
  }
});

timerResetBtn.addEventListener('click', () => {
  timerRunning = false;
  cancelAnimationFrame(timerRAF);
  timerElapsed = 0;
  timerStartBtn.textContent = 'start';
  timerStartBtn.classList.remove('running');
  comboProgress.setAttribute('stroke-dashoffset', CIRC_INNER);
  comboProgress.setAttribute('stroke', '#F1DFD3');
  comboHintEl.style.color = 'transparent';
  comboHintEl.textContent = '';
  updateTimerDisplay(0);
});

updateTimerDisplay(0);

// ─── Tags ───────────────────────────────────────────────
function initSingleSelect(groupId) {
  document.getElementById(groupId).querySelectorAll('.tag').forEach(btn => {
    btn.addEventListener('click', () => {
      btn.closest('.tag-group').querySelectorAll('.tag').forEach(b => b.classList.remove('selected'));
      btn.classList.toggle('selected');
    });
  });
}

function initMultiSelect(groupIds) {
  groupIds.forEach(id => {
    const group = document.getElementById(id);
    if (!group) return;
    group.querySelectorAll('.tag').forEach(btn => {
      btn.addEventListener('click', () => btn.classList.toggle('selected'));
    });
  });
}

initMultiSelect(['acid-tags', 'pos-tags', 'dark-tags']);

// ─── Barista + Save Shot Modal ───────────────────────────
let pendingShotData = null;

document.getElementById('save-shot-btn').addEventListener('click', () => {
  const time = document.getElementById('f-time').value;
  if (!time) { showToast('add a shot time first'); return; }

  const selected = [...document.querySelectorAll('.tag.selected')].map(b => b.dataset.val);
  const acidSelected = selected.filter(v => ['sour','salty','thin'].includes(v));
  const posSelected  = selected.filter(v => ['sweet','bright','syrupy','balanced'].includes(v));
  const darkSelected = selected.filter(v => ['bitter','ashy','dry'].includes(v));

  let summaryLabel = 'Balanced';
  if (acidSelected.length > posSelected.length && acidSelected.length >= darkSelected.length) summaryLabel = 'Under-extracted';
  if (darkSelected.length > posSelected.length && darkSelected.length > acidSelected.length) summaryLabel = 'Over-extracted';

  const grindSpeed = document.querySelector('#grind-speed-tags .tag.selected')?.dataset.val || null;

  pendingShotData = {
    grind_setting: grindVal,
    duration: parseFloat(time),
    dose_in: parseFloat(document.getElementById('f-dose').value) || null,
    yield_out: parseFloat(document.getElementById('f-yield').value) || null,
    rpm: parseInt(document.getElementById('f-rpm')?.value) || 1200,
    grind_speed: grindSpeed,
    rating: selected.join(', ') || 'Unrated',
    summary_label: summaryLabel,
    notes: document.getElementById('f-notes').value || null,
    bean_name: document.getElementById('brewing-name').textContent || 'Unknown',
  };

  document.querySelectorAll('#barista-tags .tag').forEach(t => t.classList.remove('selected'));
  document.getElementById('save-shot-modal').classList.add('open');
});

document.getElementById('save-shot-cancel').addEventListener('click', () => {
  document.getElementById('save-shot-modal').classList.remove('open');
  pendingShotData = null;
});

document.getElementById('save-shot-confirm').addEventListener('click', async () => {
  const barista = document.querySelector('#barista-tags .tag.selected');
  if (!barista) { showToast('select who pulled the shot'); return; }

  const shot = { ...pendingShotData, brewer: barista.dataset.val };
  const { error } = await db.from('shots').insert([shot]).select();
  if (error) { console.error(error); showToast('error saving — try again'); return; }

  pendingShotData = null;
  document.getElementById('f-time').value = '';
  document.getElementById('f-notes').value = '';
  document.querySelectorAll('.tag.selected').forEach(t => t.classList.remove('selected'));
  document.getElementById('save-shot-modal').classList.remove('open');
  renderShots();
  showToast('shot saved ✓');
});

// Barista single-select
document.getElementById('barista-tags').querySelectorAll('.tag').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#barista-tags .tag').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
  });
});

// ─── Toast ──────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

// Restore grind from localStorage
const saved = localStorage.getItem('ritual_grind');
if (saved) setGrind(parseInt(saved));

// ─── Init ───────────────────────────────────────────────
loadBrewingBean();
</script>
